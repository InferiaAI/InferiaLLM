{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inferiallm.fullname" . }}
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if gt (int (include "inferiallm.replicas" .)) 1 }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "inferiallm.app.selectorLabels" . | nindent 6 }}
{{- end }}
