{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "inferiallm.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := dict -}}
{{- if $existing }}{{ $existingData = $existing.data | default dict }}{{ end -}}

{{- $jwt := .Values.secrets.data.JWT_SECRET_KEY -}}
{{- if not $jwt }}{{ $jwt = (get $existingData "JWT_SECRET_KEY" | default "" | b64dec) }}{{ end -}}
{{- if not $jwt }}{{ $jwt = randAlphaNum 48 }}{{ end -}}

{{- $internal := .Values.secrets.data.INTERNAL_API_KEY -}}
{{- if not $internal }}{{ $internal = (get $existingData "INTERNAL_API_KEY" | default "" | b64dec) }}{{ end -}}
{{- if not $internal }}{{ $internal = randAlphaNum 48 }}{{ end -}}

{{- $fernet := .Values.secrets.data.SECRET_ENCRYPTION_KEY -}}
{{- if not $fernet }}{{ $fernet = (get $existingData "SECRET_ENCRYPTION_KEY" | default "" | b64dec) }}{{ end -}}
{{- /* randBytes already returns URL-safe base64.  Secret data applies the
      single Kubernetes base64 encoding below; double-encoding would make
      Fernet reject the value at application startup. */ -}}
{{- if not $fernet }}{{ $fernet = randBytes 32 }}{{ end -}}

{{- $logKey := .Values.secrets.data.LOG_ENCRYPTION_KEY -}}
{{- if not $logKey }}{{ $logKey = (get $existingData "LOG_ENCRYPTION_KEY" | default "" | b64dec) }}{{ end -}}
{{- if not $logKey }}{{ $logKey = sha256sum (randAlphaNum 48) }}{{ end -}}

{{- $pgPass := .Values.secrets.data.POSTGRES_PASSWORD -}}
{{- if not $pgPass }}{{ $pgPass = (get $existingData "POSTGRES_PASSWORD" | default "" | b64dec) }}{{ end -}}
{{- if not $pgPass }}{{ $pgPass = randAlphaNum 24 }}{{ end -}}

{{- $adminPass := .Values.secrets.data.PG_ADMIN_PASSWORD | default $pgPass -}}

{{- $superPass := .Values.secrets.data.SUPERADMIN_PASSWORD -}}
{{- if not $superPass }}{{ $superPass = (get $existingData "SUPERADMIN_PASSWORD" | default "" | b64dec) }}{{ end -}}
{{- if not $superPass }}{{ $superPass = randAlphaNum 24 }}{{ end -}}

{{- $dbHost := include "inferiallm.databaseHost" . -}}
{{- $databaseUrl := .Values.database.url -}}
{{- if not $databaseUrl -}}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:%v/%s" .Values.database.user $pgPass $dbHost .Values.database.port .Values.database.name -}}
{{- if .Values.database.ssl }}{{ $databaseUrl = printf "%s?sslmode=require" $databaseUrl }}{{ end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ $jwt | b64enc | quote }}
  INTERNAL_API_KEY: {{ $internal | b64enc | quote }}
  SECRET_ENCRYPTION_KEY: {{ $fernet | b64enc | quote }}
  LOG_ENCRYPTION_KEY: {{ $logKey | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | b64enc | quote }}
  PG_ADMIN_PASSWORD: {{ $adminPass | b64enc | quote }}
  SUPERADMIN_PASSWORD: {{ $superPass | b64enc | quote }}
  DATABASE_URL: {{ $databaseUrl | b64enc | quote }}
  {{- if .Values.secrets.data.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  {{- end }}
  {{- if .Values.ssh.authorizedKeys }}
  authorized_keys: {{ .Values.ssh.authorizedKeys | b64enc | quote }}
  {{- end }}
{{- end }}
