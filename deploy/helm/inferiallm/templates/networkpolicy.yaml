{{- if .Values.networkPolicy.enabled }}
{{- if .Values.database.bundled.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inferiallm.fullname" . }}-postgres
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "inferiallm.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "inferiallm.app.selectorLabels" . | nindent 14 }}
        {{- if .Values.migration.enabled }}
        - podSelector:
            matchLabels:
              {{- include "inferiallm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migrate
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
{{- if .Values.redis.bundled.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inferiallm.fullname" . }}-redis
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      {{- include "inferiallm.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "inferiallm.app.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
