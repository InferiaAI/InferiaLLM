{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "inferiallm.pvcName" . }}
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.redis.bundled.enabled .Values.redis.bundled.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "inferiallm.fullname" . }}-redis
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.redis.bundled.persistence.storageClass }}
  storageClassName: {{ .Values.redis.bundled.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.bundled.persistence.size }}
{{- end }}
