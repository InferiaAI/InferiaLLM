apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferiallm.fullname" . }}
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ include "inferiallm.replicas" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "inferiallm.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferiallm.app.selectorLabels" . | nindent 8 }}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inferiallm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ include "inferiallm.priorityClassName" . }}
      {{- end }}
      {{- if .Values.app.affinity }}
      affinity:
        {{- toYaml .Values.app.affinity | nindent 8 }}
      {{- else if eq .Values.mode "ha" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "inferiallm.app.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "inferiallm.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "inferiallm.configMapName" . }}
            - secretRef:
                name: {{ include "inferiallm.secretName" . }}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.persistence.models.enabled }}
            - name: data
              mountPath: /var/lib/inferia/models
              subPath: models
            {{- end }}
            {{- if .Values.persistence.pulumiState.enabled }}
            - name: data
              mountPath: /var/lib/inferia/pulumi-state
              subPath: pulumi-state
            {{- end }}
            {{- if or .Values.ssh.authorizedKeys .Values.ssh.existingSecret }}
            - name: ssh
              mountPath: /var/lib/inferia/ssh/authorized_keys
              subPath: authorized_keys
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "inferiallm.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if or .Values.ssh.authorizedKeys .Values.ssh.existingSecret }}
        - name: ssh
          secret:
            secretName: {{ include "inferiallm.sshSecretName" . }}
            defaultMode: 0400
            optional: true
        {{- end }}
