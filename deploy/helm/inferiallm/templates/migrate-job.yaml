{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inferiallm.fullname" . }}-migrate
  labels:
    {{- include "inferiallm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # A bundled Postgres StatefulSet is not created until the normal install
    # phase, so first install must run after it exists. On upgrades the schema
    # migration runs before the new application Deployment is applied.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "inferiallm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "inferiallm.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - /scripts/migrate.sh
          envFrom:
            - configMapRef:
                name: {{ include "inferiallm.configMapName" . }}
            - secretRef:
                name: {{ include "inferiallm.secretName" . }}
          env:
            - name: MIGRATION_WAIT_SECONDS
              value: {{ .Values.migration.waitSeconds | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: scripts
          configMap:
            name: {{ include "inferiallm.fullname" . }}-migrate
            defaultMode: 0555
{{- end }}
