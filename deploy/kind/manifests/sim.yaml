# llm-d-inference-sim pods (CPU stand-ins for vLLM) with simulated KV cache + KV events,
# and the two entry points the routing demo compares.
#
# Flags verified against llm-d-inference-sim v1.0.0 docs:
#   https://github.com/llm-d/llm-d-inference-sim/blob/v1.0.0/docs/configuration.md
#   https://github.com/llm-d/llm-d-inference-sim/blob/v1.0.0/docs/kv-cache.md
# Notes:
#   - Boolean flags must be written as `--flag` or `--flag=true`; v1.0.0 refuses `--flag true`
#     (the repo's own manifests/deployment_kvcache.yaml still shows the refused form).
#   - No --render-url: the sim uses its simulated tokenizer. The EPP tokenizes through the
#     sim's own /v1/completions/render, and BlockStored events carry token_ids, so the EPP's
#     index and the sim's cache see the same tokens. (Token ids won't match a real HF
#     tokenizer; that only matters when mixing sims with real vLLM.)
#   - ZMQ PUB binds tcp://*:5556 and replay ROUTER tcp://*:5559, the ports the EPP's pod
#     discovery dials (podDiscoveryConfig.socketPort / replaySocketPort), matching the llm-d
#     v1.0.0 vLLM overlay. Topic defaults to kv@<POD_IP>:<port>@<model>.
#   - POD_NAME makes the sim return `x-inference-pod`, which the demo uses as routing ground truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  labels:
    app.kubernetes.io/name: inferia-sim
spec:
  replicas: 4
  selector:
    matchLabels:
      llm-d.ai/guide: inferia-spike
  template:
    metadata:
      labels:
        llm-d.ai/guide: inferia-spike
        app.kubernetes.io/name: inferia-sim
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0@sha256:1908c421cbb44130a3212934a0dd1e279dacfe3480be93f4c28b45cd29b93ec8
          imagePullPolicy: IfNotPresent
          args:
            - --model=sim-model
            - --port=8000
            - --max-num-seqs=16
            - --max-model-len=16384
            - --enable-kvcache
            - --kv-cache-size=2048
            - --block-size=64
            - --hash-seed=42
            - --zmq-endpoint=tcp://*:5556
            - --kv-events-replay-endpoint=tcp://*:5559
            - --use-vllm-map-event-format
            - --latency-calculator=per-token
            - --prefill-overhead=5ms
            - --prefill-time-per-token=200us
            - --inter-token-latency=5ms
            - --seed=1
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 8000}
            - {name: kv-events, containerPort: 5556}
            - {name: kv-replay, containerPort: 5559}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
# Baseline: the same sim pods behind a plain Service. kube-proxy (iptables mode) picks a
# backend at random per connection, so this approximates the cache-unaware balancing that
# InferiaLLM's Envoy ROUND_ROBIN clusters do today. The demo opens a new connection per
# request so balancing is per request.
apiVersion: v1
kind: Service
metadata:
  name: sim-baseline
spec:
  type: NodePort
  selector:
    llm-d.ai/guide: inferia-spike
  ports:
    - {name: http, port: 8000, targetPort: 8000, nodePort: 30912}
---
# llm-d entry point: the router pod's Envoy sidecar listener (8081), which asks the EPP
# (ext_proc) which sim pod to use. Selector labels come from the chart's rendered Deployment.
apiVersion: v1
kind: Service
metadata:
  name: router-nodeport
spec:
  type: NodePort
  selector:
    llm-d-router-gateway: spike-epp
  ports:
    - {name: http, port: 8081, targetPort: 8081, nodePort: 30911}
