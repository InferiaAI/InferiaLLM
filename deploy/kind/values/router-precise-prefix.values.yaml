# llm-d router (standalone chart, oci://ghcr.io/llm-d/charts/llm-d-router-standalone v1.0.0)
# configured for precise prefix-cache-aware routing against llm-d-inference-sim.
#
# Derived from llm-d v1.0.0 guides/precise-prefix-cache-routing/router/precise-prefix-cache-routing.values.yaml
# (https://github.com/llm-d/llm-d/tree/v1.0.0/guides/precise-prefix-cache-routing), with these changes:
#   - modelName is the simulator's served model (simulated tokenizer; no HF token needed)
#   - no HF_TOKEN env (the sim model is not a HuggingFace repo)
#   - CPU/memory requests sized for a laptop kind node (the guide's base values ask 4 CPU / 8Gi
#     each for the EPP and the Envoy sidecar)
#   - peakPrefillThroughput is the guide's H100 number; the affinity filter only uses it to decide
#     when a cached pod is "too busy". It is not calibrated for the sim (stated in the ADR).
router:
  epp:
    replicas: 1
    image:
      # Pin by digest (multi-arch index) as well as tag.
      tag: v1.0.0@sha256:024188e998f516879f68532016ca24fabca00afbdcc2af9a61b17634e197df2c
    flags:
      v: 2
      ha-enable-leader-election: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    pluginsConfigFile: "precise-prefix-cache-routing-plugins.yaml"
    pluginsCustomConfig:
      precise-prefix-cache-routing-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              modelName: sim-model
              vllm:
                endpointDiscovery:
                  attemptTimeout: 2s
                messagesRenderMode: auto
                responsesRenderMode: auto
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
                hashAlgorithm: xxh64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                engineType: "vllm"
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  replaySocketPort: 5559
          - type: inflight-load-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: prefix-cache-affinity-filter
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              peakPrefillThroughput: 15926
          - type: token-load-scorer
        dataLayer:
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "inferia-spike"

  proxy:
    proxyType: envoy
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "2"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "10"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 512Mi
