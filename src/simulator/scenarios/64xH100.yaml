# Eight 8x H100 SXM nodes serving Llama-3.1-70B as 16 TP4 replicas.
# A configurable scenario, not a benchmark claim. Outputs are SIMULATED and,
# until calibration (T5), use uncalibrated roofline efficiencies.
name: 64xH100
description: 8 nodes x 8 H100 SXM; Llama-3.1-70B, TP4 x 16 replicas; chat plus batch.
cluster:
  pools:
    - {name: h100, gpu: H100-SXM-80GB, gpus_per_node: 8, nodes: 8}
models: [llama-3.1-70b]
deployment:
  - name: chat-70b
    model: llama-3.1-70b
    pool: h100
    tensor_parallel: 4
    replicas: 16
    max_model_len: 32768
admission: {max_waiting_per_replica: 1024}
workload:
  arrival: {process: poisson, rate_rps: 60}
  classes:
    - class: interactive_chat
      weight: 0.8
      input_tokens: {dist: lognormal, median: 800, sigma: 1.0, max: 16384}
      output_tokens: {dist: lognormal, median: 250, sigma: 0.8, max: 2048}
      shared_prefix: {groups: 32, tokens: 512}
    - class: batch
      weight: 0.2
      input_tokens: {dist: lognormal, median: 1500, sigma: 0.7, max: 16384}
      output_tokens: {dist: lognormal, median: 400, sigma: 0.6, max: 4096}
run: {seed: 1, duration_s: 300, warmup_s: 60, slo_ttft_p95_s: 2.0}
