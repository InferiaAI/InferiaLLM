# One 8x H100 SXM node serving Llama-3.1-8B as 8 single-GPU replicas.
# A configurable scenario, not a benchmark claim. Outputs are SIMULATED and,
# until calibration (T5), use uncalibrated roofline efficiencies.
name: 8xH100
description: 1 node x 8 H100 SXM; Llama-3.1-8B, TP1 x 8 replicas; chat with shared system prompts.
cluster:
  pools:
    - {name: h100, gpu: H100-SXM-80GB, gpus_per_node: 8, nodes: 1}
models: [llama-3.1-8b]
deployment:
  - name: chat-8b
    model: llama-3.1-8b
    pool: h100
    tensor_parallel: 1
    replicas: 8
    max_model_len: 32768
admission: {max_waiting_per_replica: 1024}
workload:
  arrival: {process: poisson, rate_rps: 40}
  classes:
    - class: interactive_chat
      weight: 1
      input_tokens: {dist: lognormal, median: 800, sigma: 1.0, max: 16384}
      output_tokens: {dist: lognormal, median: 250, sigma: 0.8, max: 2048}
      shared_prefix: {groups: 16, tokens: 512}
run: {seed: 1, duration_s: 300, warmup_s: 60, slo_ttft_p95_s: 1.0}
