# A heterogeneous cluster with a static class-to-deployment mapping.
# A configurable scenario, not a benchmark claim. Outputs are SIMULATED;
# A100 and L40S have no calibration data, so they are roofline-scaled from
# datasheets with the same uncalibrated efficiencies.
name: hetero-h100-a100-l40s
description: 8 H100 SXM (70B TP4 x 2, chat) + 8 A100 SXM (8B TP1 x 8, long context) + 8 L40S (8B TP1 x 8, batch).
cluster:
  pools:
    - {name: h100, gpu: H100-SXM-80GB, gpus_per_node: 8, nodes: 1}
    - {name: a100, gpu: A100-SXM-80GB, gpus_per_node: 8, nodes: 1}
    - {name: l40s, gpu: L40S-48GB, gpus_per_node: 4, nodes: 2}
models: [llama-3.1-70b, llama-3.1-8b]
deployment:
  - {name: chat-70b, model: llama-3.1-70b, pool: h100, tensor_parallel: 4, replicas: 2, max_model_len: 32768}
  - {name: long-8b, model: llama-3.1-8b, pool: a100, tensor_parallel: 1, replicas: 8, max_model_len: 65536}
  - {name: batch-8b, model: llama-3.1-8b, pool: l40s, tensor_parallel: 1, replicas: 8, max_model_len: 16384}
admission: {max_waiting_per_replica: 1024}
workload:
  arrival: {process: poisson, rate_rps: 20}
  classes:
    - class: interactive_chat
      weight: 0.5
      deployment: chat-70b
      input_tokens: {dist: lognormal, median: 800, sigma: 1.0, max: 16384}
      output_tokens: {dist: lognormal, median: 250, sigma: 0.8, max: 2048}
      shared_prefix: {groups: 8, tokens: 512}
    - class: long_context
      weight: 0.2
      deployment: long-8b
      input_tokens: {dist: lognormal, median: 20000, sigma: 0.5, max: 60000}
      output_tokens: {dist: lognormal, median: 400, sigma: 0.6, max: 4096}
    - class: batch
      weight: 0.3
      deployment: batch-8b
      input_tokens: {dist: lognormal, median: 1500, sigma: 0.7, max: 12000}
      output_tokens: {dist: lognormal, median: 400, sigma: 0.6, max: 4096}
run: {seed: 1, duration_s: 300, warmup_s: 60, slo_ttft_p95_s: 2.0}
