name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: inferia
          POSTGRES_PASSWORD: inferia
          POSTGRES_DB: inferia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inferia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The DB-backed tests read one of these, depending on when they were written.
    env:
      TEST_DATABASE_URL: postgresql://inferia:inferia@localhost:5432/inferia_test
      INFERIA_TEST_DATABASE_URL: postgresql://inferia:inferia@localhost:5432/inferia_test
      POSTGRES_DSN: postgresql://inferia:inferia@localhost:5432/inferia_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: inferia
      POSTGRES_PASSWORD: inferia
      POSTGRES_DB: inferia_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install skypilot
          pip install -e ".[dev]"

      - name: Load test database schema
        run: python scripts/load_test_schema.py

      - name: Run unit tests
        run: |
          pytest src/tests \
            --junitxml=junit/test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
