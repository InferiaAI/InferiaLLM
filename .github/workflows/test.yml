name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install skypilot
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          # Everything under src/tests runs. These do not, yet: see #308.
          IGNORES=(
            # Need a live Postgres.
            --ignore=src/tests/infra/schema/migrations/test_20260530_pool_first_deployments.py
            --ignore=src/tests/orchestration/model_cache/test_repo.py
            --ignore=src/tests/orchestration/model_deployment/test_createpool_metadata_only.py
            --ignore=src/tests/orchestration/model_deployment/test_delete_endpoint_node_teardown.py
            --ignore=src/tests/orchestration/model_deployment/test_delete_pool_cascade_db.py
            --ignore=src/tests/orchestration/model_deployment/test_deploy_endpoint_pool_first.py
            --ignore=src/tests/orchestration/model_deployment/test_deployment_linker.py
            --ignore=src/tests/orchestration/model_deployment/test_grpc_delete_refcount.py
            --ignore=src/tests/orchestration/model_deployment/test_pool_placer.py
            --ignore=src/tests/orchestration/model_deployment/test_start_resume.py
            --ignore=src/tests/orchestration/model_deployment/test_terminate_endpoint_refcount.py
            --ignore=src/tests/orchestration/repositories/test_inventory_finalize.py
            --ignore=src/tests/orchestration/repositories/test_inventory_repo_gpu_refcount.py
            --ignore=src/tests/orchestration/repositories/test_model_deployment_repo_extensions.py
            --ignore=src/tests/orchestration/repositories/test_pool_repo_count_nodes.py

            # Need live infrastructure or cloud credentials.
            --ignore=src/tests/orchestration/infra/test_setup.py
            --ignore=src/tests/orchestration/test/adapter_test/test_gcp_vllm_deploy.py
            --ignore=src/tests/orchestration/test/adapter_test/test_k8s_compute_e2e.py
            --ignore=src/tests/orchestration/test/adapter_test/test_model_deploy.py
            --ignore=src/tests/orchestration/test/adapter_test/test_model_deploy_nosana.py
            --ignore=src/tests/orchestration/test/adapter_test/test_skypilot_adapter.py
            --ignore=src/tests/orchestration/test/e2e/test_e2e_control_plane.py
            --ignore=src/tests/orchestration/test/integration/test_control_plane_e2e.py

            # Currently failing.
            --ignore=src/tests/api_gateway/test_app_startup_catalog.py
            --ignore=src/tests/api_gateway/test_config_modes.py
            --ignore=src/tests/api_gateway/test_oauth_router.py
            --ignore=src/tests/api_gateway/test_oidc_role_mapping.py
            --ignore=src/tests/api_gateway/test_rate_limiter_ttl.py
            --ignore=src/tests/cli/test_dashboard_config.py
            --ignore=src/tests/common/test_cli_providers.py
            --ignore=src/tests/common/test_cluster_naming.py
            --ignore=src/tests/deploy/test_compose_ports.py
            --ignore=src/tests/deploy/test_env_parity.py
            --ignore=src/tests/orchestration/api/test_nodes.py
            --ignore=src/tests/orchestration/provisioning_state_machine/reconciler/test_reaper.py
            --ignore=src/tests/orchestration/repositories/test_finalize_pool_delete.py
            --ignore=src/tests/orchestration/repositories/test_purge_node.py
            --ignore=src/tests/orchestration/test/adapter_test/test_adapter_engine.py
            --ignore=src/tests/orchestration/test/autoscaler/test_scale_down.py
            --ignore=src/tests/orchestration/test/autoscaler/test_scale_up.py
            --ignore=src/tests/orchestration/test/compute_pools_nodes/test_compute_node_grpc.py
            --ignore=src/tests/orchestration/test/compute_pools_nodes/test_fake_adapter.py
            --ignore=src/tests/orchestration/test/gang/test_gang_concurrency.py
            --ignore=src/tests/orchestration/test/gang/test_gang_insufficient_capacity.py
            --ignore=src/tests/orchestration/test/gang/test_gang_success.py
            --ignore=src/tests/orchestration/test/model_deployment/test_model_deployment_e2e.py
            --ignore=src/tests/orchestration/test/model_registry/test_model_registry.py
            --ignore=src/tests/orchestration/test/placement_test/test_placement_engine.py
            --ignore=src/tests/orchestration/test/quota/test_billing_events.py
            --ignore=src/tests/orchestration/test/quota/test_hard_quota.py
            --ignore=src/tests/orchestration/test/quota/test_quota_preemption.py
            --ignore=src/tests/orchestration/test/quota/test_quota_release.py
            --ignore=src/tests/orchestration/test/scheduler/test_concurrency.py
            --ignore=src/tests/orchestration/test/spot/test_spot_allocation.py
            --ignore=src/tests/orchestration/test/spot/test_spot_reclaim.py
            --ignore=src/tests/orchestration/test/spot/test_spot_vs_ondemand.py
            --ignore=src/tests/orchestration/test/test_aws_realtime_capacity.py
            --ignore=src/tests/orchestration/test/test_blocking_calls.py
            --ignore=src/tests/orchestration/test/test_grpc.py
            --ignore=src/tests/orchestration/test/test_node_liveness.py
            --ignore=src/tests/providers/aws/test_engine_ami_bake.py
            --ignore=src/tests/providers/pulumi/test_base.py
            --ignore=src/tests/providers/pulumi/test_credentials.py
            --ignore=src/tests/providers/pulumi/test_pulumi_aws_adapter.py
            --ignore=src/tests/providers/pulumi/test_pulumi_azure_adapter.py
            --ignore=src/tests/providers/pulumi/test_pulumi_gcp_adapter.py
            --ignore=src/tests/setup/test_setup_sh.py

            # Pass alone, fail once the whole suite has run: something earlier
            # leaves the settings in external mode.
            --ignore=src/tests/api_gateway/test_config.py
            --ignore=src/tests/orchestration/provisioning_state_machine/phases/test_pulumi_up.py
          )
          pytest src/tests "${IGNORES[@]}" \
            -p no:twisted -p no:trio -p no:tornasync \
            --junitxml=junit/test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
